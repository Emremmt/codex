<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2B Yarış Oyunu</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
      }
      body {
        margin: 0;
        background: #151515;
        color: #f3f3f3;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      header {
        padding: 0.8rem 1rem;
        background: #202020;
        border-bottom: 1px solid #333;
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        justify-content: space-between;
      }
      #hud {
        display: flex;
        gap: 1rem;
        align-items: center;
        flex-wrap: wrap;
      }
      .pill {
        background: #2a2a2a;
        border: 1px solid #444;
        border-radius: 999px;
        padding: 0.35rem 0.7rem;
        font-size: 0.9rem;
      }
      #game-wrap {
        flex: 1;
        display: grid;
        place-items: center;
        padding: 1rem;
      }
      canvas {
        border: 2px solid #3a3a3a;
        border-radius: 8px;
        background: #0f0f0f;
        max-width: 100%;
        height: auto;
      }
      #controls {
        padding: 0.8rem 1rem;
        border-top: 1px solid #333;
        background: #202020;
        font-size: 0.95rem;
      }
      #message {
        font-weight: 700;
        color: #ffd166;
      }
      button {
        border: 1px solid #555;
        background: #2f2f2f;
        color: white;
        border-radius: 8px;
        padding: 0.4rem 0.8rem;
        cursor: pointer;
      }
      button:hover {
        background: #414141;
      }
    </style>
  </head>
  <body>
    <header>
      <div id="hud">
        <div class="pill">Seviye: <span id="level">1</span></div>
        <div class="pill">Araba: <span id="car">1 / 3</span></div>
        <div class="pill">Sıra: <span id="position">1 / 3</span></div>
        <div class="pill">Süre: <span id="time">90.0</span>s</div>
        <div class="pill">Kalan Mesafe: <span id="distance">5400</span> m</div>
      </div>
      <div>
        <button id="restart">Yeniden Başlat</button>
      </div>
    </header>

    <main id="game-wrap">
      <canvas id="game" width="960" height="540"></canvas>
    </main>

    <section id="controls">
      Kontroller: <b>W / ↑</b> hızlan, <b>S / ↓</b> fren, <b>A,D / ←,→</b> direksiyon.
      <span id="message">Yarış başlıyor!</span>
    </section>

    <script>
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");

      const levelEl = document.getElementById("level");
      const carEl = document.getElementById("car");
      const positionEl = document.getElementById("position");
      const timeEl = document.getElementById("time");
      const distanceEl = document.getElementById("distance");
      const messageEl = document.getElementById("message");
      const restartBtn = document.getElementById("restart");

      const keys = new Set();
      const laneCount = 3;
      const laneWidth = canvas.width / laneCount;
      const mapDurationSec = 90;
      const trackLengthMeters = 5400;
      const totalCars = 3;
      const maxLevels = 3;
      const rivalCount = 2;

      const state = {
        currentCar: 1,
        level: 1,
        timeLeft: mapDurationSec,
        distanceLeft: trackLengthMeters,
        running: true,
        finished: false,
        win: false,
        position: 1,
        worldOffset: 0,
      };

      const player = {
        lane: 1,
        x: laneWidth * 1 + laneWidth / 2,
        y: canvas.height - 100,
        width: 46,
        height: 84,
        speed: 0,
        maxSpeed: 310,
        acceleration: 220,
        brakePower: 290,
        steerSpeed: 420,
        progress: 0,
        color: "#ef4444",
      };

      const rivals = [];
      const roadsideTrees = [];

      function laneCenter(lane) {
        return lane * laneWidth + laneWidth / 2;
      }

      function createRivals() {
        rivals.length = 0;
        const startLanes = [0, 2];
        for (let i = 0; i < rivalCount; i++) {
          rivals.push({
            lane: startLanes[i],
            x: laneCenter(startLanes[i]),
            progress: 0,
            speed: 220 + Math.random() * 40,
            color: `hsl(${(i * 60 + 30) % 360}, 75%, 55%)`,
            width: 44,
            height: 82,
          });
        }
      }

      function createTrees() {
        roadsideTrees.length = 0;
        for (let i = 0; i < 24; i++) {
          const side = i % 2 === 0 ? "left" : "right";
          roadsideTrees.push({
            side,
            offset: i * 130,
            size: 20 + Math.random() * 12,
          });
        }
      }

      function resetRun() {
        state.level = 1;
        state.currentCar = 1;
        state.timeLeft = mapDurationSec;
        state.distanceLeft = trackLengthMeters;
        state.running = true;
        state.finished = false;
        state.win = false;
        state.position = 1;
        state.worldOffset = 0;
        messageEl.textContent = "Yarış başlıyor! 3 araba yan yana start aldı.";

        player.x = laneCenter(1);
        player.speed = 0;
        player.maxSpeed = 310;
        player.acceleration = 220;
        player.progress = 0;

        createRivals();
        createTrees();
        updateHud();
      }

      function nextLevel() {
        if (state.level >= maxLevels) {
          state.finished = true;
          state.running = false;
          state.win = true;
          messageEl.textContent = "Tüm seviyeler tamamlandı! Efsane sürüş 🏁";
          return;
        }

        state.level += 1;
        state.currentCar = state.level;
        state.timeLeft = mapDurationSec;
        state.distanceLeft = trackLengthMeters;
        state.position = 1;
        state.worldOffset = 0;

        player.maxSpeed = 310 + state.level * 11;
        player.acceleration = 220 + state.level * 4;
        player.speed = 0;
        player.x = laneCenter(1);
        player.progress = 0;

        createRivals();
        messageEl.textContent = `Seviye ${state.level}! Bu arabayla yarışı kazan.`;
      }

      function gameOver(text) {
        state.running = false;
        state.finished = true;
        state.win = false;
        messageEl.textContent = text;
      }

      function handleInput(dt) {
        if (keys.has("arrowup") || keys.has("w")) {
          player.speed += player.acceleration * dt;
        }
        if (keys.has("arrowdown") || keys.has("s")) {
          player.speed -= player.brakePower * dt;
        }

        if (keys.has("arrowleft") || keys.has("a")) {
          player.x -= player.steerSpeed * dt;
        }
        if (keys.has("arrowright") || keys.has("d")) {
          player.x += player.steerSpeed * dt;
        }

        player.speed *= 0.992;
        player.speed = Math.max(0, Math.min(player.maxSpeed, player.speed));

        const minX = 62;
        const maxX = canvas.width - 62;
        player.x = Math.max(minX, Math.min(maxX, player.x));
      }

      function updateRivals(dt) {
        for (const rival of rivals) {
          const pace = rival.speed + state.level * 7;
          rival.progress += pace * dt;

          const targetX = laneCenter(rival.lane);
          if (player.progress > 250 && Math.random() < 0.0015 * state.level) {
            rival.lane = Math.floor(Math.random() * laneCount);
          }
          rival.x = rival.x ? rival.x + (targetX - rival.x) * 0.08 : targetX;
        }
      }

      function updateRaceProgress(dt) {
        player.progress += player.speed * dt;
        state.worldOffset += player.speed * dt;

        const sorted = [...rivals.map((r) => r.progress), player.progress].sort((a, b) => b - a);
        state.position = sorted.indexOf(player.progress) + 1;

        state.distanceLeft = Math.max(0, trackLengthMeters - player.progress);
        state.timeLeft -= dt;
      }

      function collides(a, b) {
        return (
          Math.abs(a.x - b.x) * 2 < a.width + b.width &&
          Math.abs(a.y - b.y) * 2 < a.height + b.height
        );
      }

      function checkCollisions() {
        const playerBox = { x: player.x, y: player.y, width: player.width, height: player.height };

        for (const rival of rivals) {
          const rel = rival.progress - player.progress;
          if (Math.abs(rel) > 140) continue;
          const rivalY = player.y - rel;
          const rivalX = rival.x ?? laneCenter(rival.lane);

          const rivalBox = {
            x: rivalX,
            y: rivalY,
            width: rival.width,
            height: rival.height,
          };

          if (collides(playerBox, rivalBox)) {
            gameOver("Rakiple çarpıştın! Tekrar dene.");
            return;
          }
        }
      }

      function updateGame(dt) {
        if (!state.running) return;

        handleInput(dt);
        updateRivals(dt);
        updateRaceProgress(dt);
        checkCollisions();

        if (state.timeLeft <= 0 && state.distanceLeft > 0) {
          gameOver("Süre doldu! 1.5 dakikada bitiremedin.");
          return;
        }

        if (state.distanceLeft <= 0) {
          if (state.position === 1) {
            nextLevel();
          } else {
            gameOver(`Yarışı ${state.position}. bitirdin. Seviye geçmek için 1. olmalısın.`);
          }
        }

        updateHud();
      }

      function drawRoad() {
        ctx.fillStyle = "#2a2a2a";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#14532d";
        ctx.fillRect(0, 0, 70, canvas.height);
        ctx.fillRect(canvas.width - 70, 0, 70, canvas.height);

        const stripeOffset = (state.worldOffset * 0.9) % 60;
        ctx.strokeStyle = "#bdbdbd";
        ctx.lineWidth = 4;
        for (let i = 1; i < laneCount; i++) {
          for (let y = -60; y < canvas.height + 60; y += 60) {
            ctx.beginPath();
            ctx.moveTo(i * laneWidth, y + stripeOffset);
            ctx.lineTo(i * laneWidth, y + 30 + stripeOffset);
            ctx.stroke();
          }
        }
      }

      function drawTrees() {
        for (const tree of roadsideTrees) {
          const y = ((tree.offset - state.worldOffset * 0.7) % (canvas.height + 160)) - 80;
          const x = tree.side === "left" ? 35 : canvas.width - 35;
          ctx.fillStyle = "#5b3f1e";
          ctx.fillRect(x - 4, y + tree.size * 0.25, 8, tree.size * 0.55);
          ctx.beginPath();
          ctx.arc(x, y, tree.size, 0, Math.PI * 2);
          ctx.fillStyle = "#1f8a3b";
          ctx.fill();
        }
      }

      function drawCarShape(x, y, width, height, color, label = "") {
        const left = x - width / 2;
        const top = y - height / 2;

        ctx.fillStyle = color;
        ctx.fillRect(left, top, width, height);

        ctx.fillStyle = "#111";
        ctx.fillRect(left + 4, top + 7, width - 8, 15);
        ctx.fillRect(left + 4, top + height - 22, width - 8, 15);

        ctx.fillStyle = "#3aa7ff";
        ctx.fillRect(left + 8, top + 28, width - 16, 18);

        ctx.fillStyle = "#0b0b0b";
        ctx.fillRect(left - 5, top + 10, 5, 18);
        ctx.fillRect(left + width, top + 10, 5, 18);
        ctx.fillRect(left - 5, top + height - 28, 5, 18);
        ctx.fillRect(left + width, top + height - 28, 5, 18);

        if (label) {
          ctx.fillStyle = "#fff";
          ctx.font = "bold 12px Arial";
          ctx.textAlign = "center";
          ctx.fillText(label, x, top - 8);
        }
      }

      function drawRivals() {
        const ordered = [...rivals].sort((a, b) => b.progress - a.progress);
        for (const rival of ordered) {
          const rel = rival.progress - player.progress;
          if (rel < -140 || rel > canvas.height - 40) continue;
          const y = player.y - rel;
          const x = rival.x ?? laneCenter(rival.lane);
          const rank = ordered.indexOf(rival) + 1;
          drawCarShape(x, y, rival.width, rival.height, rival.color, `${rank}`);
        }
      }

      function render() {
        drawRoad();
        drawTrees();
        drawRivals();
        drawCarShape(player.x, player.y, player.width, player.height, player.color, "SEN");

        if (!state.running) {
          ctx.fillStyle = "rgba(0,0,0,0.55)";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = "#fff";
          ctx.font = "bold 42px Arial";
          ctx.textAlign = "center";
          ctx.fillText(state.win ? "KAZANDIN" : "OYUN BİTTİ", canvas.width / 2, canvas.height / 2);
          ctx.font = "20px Arial";
          ctx.fillText("Tekrar denemek için 'Yeniden Başlat'", canvas.width / 2, canvas.height / 2 + 40);
        }
      }

      function updateHud() {
        levelEl.textContent = state.level;
        carEl.textContent = `${state.currentCar} / ${totalCars}`;
        positionEl.textContent = `${state.position} / ${totalCars}`;
        timeEl.textContent = Math.max(0, state.timeLeft).toFixed(1);
        distanceEl.textContent = Math.max(0, Math.ceil(state.distanceLeft));
      }

      let lastTime = performance.now();
      function loop(now) {
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;
        updateGame(dt);
        render();
        requestAnimationFrame(loop);
      }

      const controlKeys = new Set(["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "w", "a", "s", "d", "W", "A", "S", "D"]);

      window.addEventListener("keydown", (e) => {
        if (controlKeys.has(e.key)) {
          e.preventDefault();
        }
        keys.add(e.key.toLowerCase());
      });
      window.addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
      restartBtn.addEventListener("click", resetRun);

      resetRun();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
