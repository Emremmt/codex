<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flappy Plane</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-wrapper">
      <h1>Flappy Plane</h1>
      <p class="instructions">Boşluk tuşu / Tıklama ile uçağı yukarı kaldır.</p>
      <canvas id="gameCanvas" width="420" height="640" aria-label="Flappy Plane Oyunu"></canvas>
      <div class="hud">
        <span>Skor: <strong id="score">0</strong></span>
        <span>En Yüksek: <strong id="bestScore">0</strong></span>
      </div>
      <button id="restartBtn" hidden>Tekrar Başlat</button>
    </main>

    <script src="game.js"></script>
  </body>
</html>
